name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify (6 skills, no tool registration)
        run: pnpm verify

      - name: Behavior tests
        run: pnpm test

      - name: Publish to npm
        id: publish
        # NPM_TOKEN（granular bypass 2FA）与 --provenance 不兼容：
        # --provenance 只能走 OIDC Trusted Publisher，用 token 时必须去掉该参数，否则 npm 返回 404
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # 判据：先看 npm view 的退出码。原实现用 grep 匹配 versions 输出，
          # npm view 失败时的错误文本同样可能命中，导致误判为已发布而跳过。
          PUBLISHED=""
          if LIST_JSON=$(npm view @wenaixi/dsh-ponytail versions --json 2>/dev/null); then
            PUBLISHED=$(printf '%s' "$LIST_JSON" | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                try{const v=JSON.parse(s);process.stdout.write(Array.isArray(v)?v[v.length-1]:'')}catch{}
              })")
          fi
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "Version $VERSION already published, skipping"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "Publishing with NPM_TOKEN (without --provenance)"
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > "$NPM_CONFIG_USERCONFIG" 2>/dev/null || true
            npm publish --access public
          else
            echo "Publishing with OIDC Trusted Publisher (--provenance)"
            npm publish --provenance --access public
          fi

      - name: Resolve release tag
        id: tag
        # github.ref_name 只在 tag 触发时是 v<version>；workflow_dispatch 手动触发时
        # 它是分支名（如 main），直接拿去当 tag_name 会让 action-gh-release 报
        # 「GitHub Releases requires a tag」。所以统一从 package.json 推导。
        run: |
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || jq -r .version package.json)
          echo "name=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing GitHub Release
        id: release
        # npm 已发布不等于 GitHub Release 已存在：两者是独立产物。此前把
        # Release 步骤绑在 publish 的 skipped 输出上，导致「npm 已发、Release
        # 缺失」时永远补不回来（本次 v5.6.5 就是这样丢的）。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.tag.outputs.name }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: false
          body: |
            完整更新内容见 [CHANGELOG.md](https://github.com/Wenaixi/dsh-ponytail/blob/${{ steps.tag.outputs.name }}/CHANGELOG.md)

            Local version: ${{ steps.tag.outputs.name }}
            Upstream reference: DietrichGebert/ponytail 4.10.3 (reference snapshot)
            DSH 适配：零 tool 注册，常驻梯子七阶 + 6 个中文原生技能

            Tag: `${{ steps.tag.outputs.name }}`
