name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify (6 skills + 无空 tool)
        run: node scripts/verify.mjs

      - name: Publish to npm
        id: publish
        # NPM_TOKEN（granular bypass 2FA）与 --provenance 不兼容：
        # --provenance 只能走 OIDC Trusted Publisher，用 token 时必须去掉该参数，否则 npm 返回 404
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view @wenaixi/dsh-ponytail versions --json 2>/dev/null | grep -q "\"$VERSION\""; then
            echo "Version $VERSION already published, skipping"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "Publishing with NPM_TOKEN (without --provenance)"
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > "$NPM_CONFIG_USERCONFIG" 2>/dev/null || true
            npm publish --access public
          else
            echo "Publishing with OIDC Trusted Publisher (--provenance)"
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        if: steps.publish.outputs.skipped != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            📝 完整更新内容见 [CHANGELOG.md](https://github.com/Wenaixi/dsh-ponytail/blob/${{ github.ref_name }}/CHANGELOG.md)

            Tag: `${{ github.ref_name }}`
