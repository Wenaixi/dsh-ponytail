name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    # 避免 publish 在非 tag 的 push 上被触发（workflow_dispatch 手动触发除外）
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify (6 skills + 无空 tool)
        run: node scripts/verify.mjs

      - name: Publish to npm
        # 优先使用 NPM_TOKEN（granular bypass 2FA），未配置时回退到 OIDC Trusted Publisher
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
            npm publish --provenance --access public
          else
            echo "NPM_TOKEN 未配置，尝试 OIDC Trusted Publisher"
            npm publish --provenance --access public
          fi
